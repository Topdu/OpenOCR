Global:
  device: gpu
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./output/rec/svtrv2_scriptmoe_mlt/
  save_epoch_step: [30, 1]
  # validation is run every 2000 iterations
  eval_batch_step: [0, 2000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: False
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  # for data or label process
  character_dict_path: &character_dict_path ./tools/utils/mlt_dict.txt
  max_text_length: &max_text_length 25  # 100 for end2end ocr
  use_space_char: &use_space_char True
  save_res_path: ./output/rec/svtrv2_scriptmoe_mlt.txt
  use_amp: True
  # ScriptMoE activates only top-k experts per sample, so unused parameters
  # must be allowed under DistributedDataParallel.
  find_unused_parameters: True

Optimizer:
  name: AdamW
  lr: 0.00065
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5 # pct_start 0.075*20 = 1.5ep
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: SVTRv2_AR
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    out_channels: 256
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: False
  Decoder:
    name: ScriptMoEDecoder
    num_encoder_layers: -1
    beam_size: 0
    num_decoder_layers: 2
    nhead: 12
    max_len: *max_text_length
    # ---- MoE-specific parameters ----
    num_experts: 4          # 4 expert groups: Latin/Cyrillic, CJK, Arabic/RTL, Indic/SE-Asian
    top_k: 2                # Activate top-2 experts per sample
    routing_mode: sample    # Sample-level routing (all tokens in one image share experts)
    jitter_noise: 0.05       # Router noise for training stability
    shared_expert_ratio: 0.5  # Shared expert FFN dimension ratio (1.0 = same as specialized)


Loss:
  name: ScriptMoELoss
  label_smoothing: 0.1
  script_cls_weight: 0.1       # Weight for script classification supervision

PostProcess:
  name: ScriptMoELabelDecode
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecMLTMetric
  main_indicator: acc
  max_ratio: &max_ratio 8   # 20 for end2end ocr

Train:
  dataset:
    name: MLTRatioDataSetTVResize
    ds_width: True
    padding: false
    data_dir_list: [
      ]
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - PARSeqAugPIL:
      - ScriptAwareARLabelEncode: # Encode labels with script detection
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
          num_script_groups: 4
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'script_id'] # script_id appended
  sampler:
    name: RatioSampler
    scales: [[128, 32]] # w, h
    first_bs: &bs 128
    fix_bs: false
    divided_factor: [4, 16] # w, h
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: *max_ratio
    num_workers: 8

Eval:
  dataset:
    name: MLTRatioDataSetTVResize
    ds_width: True
    padding: False
    data_dir_list: [
    ]
    transforms:
      - DecodeImagePIL: # load image
          img_mode: RGB
      - ARLabelEncode: # Standard encode for eval (no script_id needed)
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length'] # standard 3 keys for eval
  sampler:
    name: RatioSampler
    scales: [[128, 32]] # w, h
    first_bs: *bs
    fix_bs: false
    divided_factor: [4, 16] # w, h
    is_training: False
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 8
